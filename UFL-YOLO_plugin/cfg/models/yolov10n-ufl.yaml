# YOLOv10-n (UFL) configuration notes.
# Adapt this pseudo-yaml to your YOLOv10 repo builder.
nc: 4  # change to your dataset classes

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, UAAM, [64]]  # insert UAAM after shallow stage
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, PSA, [1024]] # 10

# YOLOv8.0n head
head:
  # incorporate SOEP by collecting P2 and P3, then replacing P3 outputs with SOEP(p2,p3)
  - [SOEP, [p2_ch, p3_ch]]

  - [[16, 19, 22], 1, v10Detect, [nc]] # Detect(P3, P4, P5)
